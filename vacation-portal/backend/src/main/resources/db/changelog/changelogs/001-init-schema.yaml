databaseChangeLog:
  - changeSet:
      id: 001-create-schema
      author: Arseniy Kolyshkin
      changes:
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS vacation_portal

  - changeSet:
      id: 001-create-vacation-requests
      author: Arseniy Kolyshkin
      changes:
        - createTable:
            schemaName: vacation_portal
            tableName: vacation_requests
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: reviewer_id
                  type: uuid
              - column:
                  name: review_comment
                  type: text
              - column:
                  name: reviewed_at
                  type: timestamptz
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - sql:
            sql: |
              ALTER TABLE vacation_portal.vacation_requests
              ADD CONSTRAINT chk_date_range CHECK (end_date >= start_date)
        - createIndex:
            schemaName: vacation_portal
            tableName: vacation_requests
            indexName: idx_vr_user_id
            columns:
              - column: { name: user_id }
        - createIndex:
            schemaName: vacation_portal
            tableName: vacation_requests
            indexName: idx_vr_status
            columns:
              - column: { name: status }
        - createIndex:
            schemaName: vacation_portal
            tableName: vacation_requests
            indexName: idx_vr_created_at
            columns:
              - column: { name: created_at, descending: true }
