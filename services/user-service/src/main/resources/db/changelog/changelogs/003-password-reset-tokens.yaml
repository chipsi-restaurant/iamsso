databaseChangeLog:
  - changeSet:
      id: 003-create-password-reset-tokens
      author: Arseniy Kolyshkin
      changes:
        - createTable:
            schemaName: iamsso_users
            tableName: password_reset_tokens
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_prt_user
                    references: iamsso_users.users(id)
                    deleteCascade: true
              - column:
                  name: token
                  type: varchar(500)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: expires_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createIndex:
            schemaName: iamsso_users
            tableName: password_reset_tokens
            indexName: idx_prt_user_id
            columns:
              - column: { name: user_id }
        - createIndex:
            schemaName: iamsso_users
            tableName: password_reset_tokens
            indexName: idx_prt_token
            columns:
              - column: { name: token }
