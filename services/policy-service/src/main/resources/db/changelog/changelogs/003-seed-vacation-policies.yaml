databaseChangeLog:
  - changeSet:
      id: 003-seed-vacation-user-read
      author: Arseniy Kolyshkin
      changes:
        - insert:
            schemaName: iamsso_policies
            tableName: policies
            columns:
              - column: { name: id, valueComputed: "gen_random_uuid()" }
              - column: { name: name, value: "vacation-user-read" }
              - column: { name: description, value: "Users can read vacation requests" }
              - column: { name: role, value: "user" }
              - column: { name: effect, value: "ALLOW" }
              - column: { name: action, value: "READ" }
              - column: { name: resource_pattern, value: "vacation-requests/*" }
              - column: { name: priority, valueNumeric: 10 }
              - column: { name: enabled, valueBoolean: true }

  - changeSet:
      id: 003-seed-vacation-user-create
      author: Arseniy Kolyshkin
      changes:
        - insert:
            schemaName: iamsso_policies
            tableName: policies
            columns:
              - column: { name: id, valueComputed: "gen_random_uuid()" }
              - column: { name: name, value: "vacation-user-create" }
              - column: { name: description, value: "Users can create vacation requests (and cancel their own via POST)" }
              - column: { name: role, value: "user" }
              - column: { name: effect, value: "ALLOW" }
              - column: { name: action, value: "CREATE" }
              - column: { name: resource_pattern, value: "vacation-requests/*" }
              - column: { name: priority, valueNumeric: 10 }
              - column: { name: enabled, valueBoolean: true }

  - changeSet:
      id: 003-seed-vacation-moderator-all
      author: Arseniy Kolyshkin
      changes:
        - insert:
            schemaName: iamsso_policies
            tableName: policies
            columns:
              - column: { name: id, valueComputed: "gen_random_uuid()" }
              - column: { name: name, value: "vacation-moderator-all" }
              - column: { name: description, value: "Moderators can manage all vacation requests (approve/reject)" }
              - column: { name: role, value: "moderator" }
              - column: { name: effect, value: "ALLOW" }
              - column: { name: action, value: "*" }
              - column: { name: resource_pattern, value: "vacation-requests/*" }
              - column: { name: priority, valueNumeric: 50 }
              - column: { name: enabled, valueBoolean: true }
