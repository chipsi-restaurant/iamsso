databaseChangeLog:
  - changeSet:
      id: 002-seed-admin-allow-all
      author: Arseniy Kolyshkin
      changes:
        - insert:
            schemaName: iamsso_policies
            tableName: policies
            columns:
              - column: { name: id, valueComputed: "gen_random_uuid()" }
              - column: { name: name, value: "admin-allow-all" }
              - column: { name: description, value: "Admin can do everything" }
              - column: { name: role, value: "admin" }
              - column: { name: effect, value: "ALLOW" }
              - column: { name: action, value: "*" }
              - column: { name: resource_pattern, value: "*" }
              - column: { name: priority, valueNumeric: 100 }
              - column: { name: enabled, valueBoolean: true }

