spring:
  cloud:
    gateway:
      routes: []
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/.well-known/jwks.json

app:
  public-paths:
    - /oauth2/**
    - /.well-known/**
    - /login
    - /actuator/**
  policy-service:
    evaluate-url: http://localhost:8082/api/v1/policy/evaluate
  services:
    auth-url: http://localhost:8080
    user-url: http://localhost:8081
    policy-url: http://localhost:8082
    mfa-url: http://localhost:8083
    notification-url: http://localhost:8084
    audit-url: http://localhost:8085
    session-url: http://localhost:8086
    vacation-url: http://localhost:8087
