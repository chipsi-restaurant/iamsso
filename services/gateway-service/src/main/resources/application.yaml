server:
  port: 8090

spring:
  application:
    name: gateway-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/.well-known/jwks.json

app:
  public-paths:
    - /oauth2/**
    - /.well-known/**
    - /login
    - /userinfo
    - /actuator/**
    - /health/**
    - /api/v1/sessions/logout
    - /mfa-challenge
  policy-service:
    evaluate-url: http://localhost:8082/api/v1/policy/evaluate
