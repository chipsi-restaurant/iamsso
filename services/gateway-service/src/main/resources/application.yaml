server:
  port: 8090

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      default-filters:
        - PreserveHostHeader
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/.well-known/jwks.json

app:
  public-paths:
    - /oauth2/**
    - /.well-known/**
    - /login
    - /userinfo
    - /actuator/**
    - /health/**
    - /api/v1/sessions/logout
    - /mfa-challenge
    - /forgot-password
    - /reset-password
    - /api/v1/users/*/verify-email
  policy-service:
    evaluate-url: http://localhost:8082/api/v1/policy/evaluate
  services:
    auth-url: ${AUTH_SERVICE_URL:http://localhost:8080}
    user-url: ${USER_SERVICE_URL:http://localhost:8081}
    policy-url: ${POLICY_SERVICE_URL:http://localhost:8082}
    mfa-url: ${MFA_SERVICE_URL:http://localhost:8083}
    notification-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
    audit-url: ${AUDIT_SERVICE_URL:http://localhost:8085}
    session-url: ${SESSION_SERVICE_URL:http://localhost:8086}
