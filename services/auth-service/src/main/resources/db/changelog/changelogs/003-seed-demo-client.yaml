databaseChangeLog:
  - changeSet:
      id: 003-seed-demo-oauth-client
      author: Arseniy Kolyshkin
      context: dev
      changes:
        - insert:
            schemaName: iamsso_auth
            tableName: oauth_clients
            columns:
              - column:
                  name: client_id
                  value: demo-app
              - column:
                  name: client_name
                  value: Demo Application
              - column:
                  name: client_secret_hash
                  value: "$2a$10$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy"
              - column:
                  name: grant_types
                  value: "authorization_code,refresh_token,client_credentials"
              - column:
                  name: redirect_uris
                  value: "http://localhost:3000/callback"
              - column:
                  name: scopes
                  value: "openid profile email iam:admin"
              - column:
                  name: token_endpoint_auth_method
                  value: client_secret_post
              - column:
                  name: access_token_ttl_seconds
                  valueNumeric: 3600
              - column:
                  name: refresh_token_ttl_seconds
                  valueNumeric: 2592000
              - column:
                  name: device_code_ttl_seconds
                  valueNumeric: 600
