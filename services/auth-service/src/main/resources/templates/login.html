<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sign In — iamsso</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); padding: 2rem; width: 100%; max-width: 380px; }
        h1 { font-size: 1.25rem; text-align: center; margin-bottom: 1.5rem; color: #333; }
        .error { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; padding: .5rem .75rem; border-radius: 4px; font-size: .875rem; margin-bottom: 1rem; }
        label { display: block; font-size: .875rem; font-weight: 500; color: #555; margin-bottom: .25rem; }
        input[type="text"], input[type="password"] { width: 100%; padding: .5rem .75rem; border: 1px solid #d1d5db; border-radius: 4px; font-size: .875rem; margin-bottom: 1rem; }
        input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,.2); }
        button { width: 100%; padding: .625rem; background: #2563eb; color: #fff; border: none; border-radius: 4px; font-size: .875rem; font-weight: 500; cursor: pointer; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
<div class="card">
    <h1>Sign In</h1>

    <div class="error" th:if="${error == 'invalid_credentials'}">Invalid username or password.</div>
    <div class="error" th:if="${error == 'account_disabled'}">This account is disabled.</div>
    <div class="error" th:if="${error == 'account_locked'}">This account is temporarily locked.</div>

    <form method="post" th:action="@{/oauth2/authorize/callback}">
        <input type="hidden" name="auth_request_id" th:value="${authRequestId}"/>

        <label for="username">Username or email</label>
        <input id="username" type="text" name="username" autocomplete="username" autofocus required/>

        <label for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required/>

        <button type="submit">Sign in</button>
    </form>
</div>
</body>
</html>
