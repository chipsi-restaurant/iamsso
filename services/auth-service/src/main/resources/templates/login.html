<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Вход — iamsso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #ffffff;
            color: #061b31;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 500;
            letter-spacing: -0.4px;
            color: #061b31;
            margin-bottom: 6px;
        }
        .logo span { color: #533afd; }

        .subtitle {
            font-size: 14px;
            font-weight: 300;
            color: #64748d;
            margin-bottom: 32px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e5edf5;
            border-radius: 6px;
            padding: 32px;
            box-shadow: rgba(50,50,93,0.25) 0px 30px 45px -30px, rgba(0,0,0,0.1) 0px 18px 36px -18px;
        }

        .card h2 {
            font-size: 18px;
            font-weight: 300;
            color: #061b31;
            margin-bottom: 24px;
            letter-spacing: -0.18px;
        }

        .error {
            background: rgba(234,34,97,0.06);
            border: 1px solid rgba(234,34,97,0.2);
            color: #ea2261;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 400;
            margin-bottom: 16px;
            text-align: left;
        }

        .success { background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.25); color: #059669; padding: 8px 12px; border-radius: 4px; font-size: 13px; font-weight: 400; margin-bottom: 16px; text-align: left; }
        .forgot-link { display: inline-block; margin-top: 12px; font-size: 13px; color: #533afd; text-decoration: none; }
        .forgot-link:hover { text-decoration: underline; }

        .field { margin-bottom: 16px; text-align: left; }

        label {
            display: block;
            font-size: 13px;
            font-weight: 400;
            color: #273951;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #e5edf5;
            border-radius: 4px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 300;
            color: #061b31;
            background: #ffffff;
            transition: border-color 0.15s;
        }
        input::placeholder { color: #64748d; }
        input:focus {
            outline: none;
            border-color: #533afd;
            box-shadow: 0 0 0 2px rgba(83,58,253,0.08);
        }

        button {
            width: 100%;
            padding: 10px 16px;
            background: #533afd;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 400;
            cursor: pointer;
            transition: background 0.15s;
            margin-top: 8px;
        }
        button:hover { background: #4434d4; }
        button:active { background: #2e2b8c; }

        .footer {
            margin-top: 24px;
            font-size: 12px;
            font-weight: 300;
            color: #64748d;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">iam<span>sso</span></div>
    <p class="subtitle">Управление доступом на основе политик</p>

    <div class="card">
        <h2>Вход в систему</h2>

        <div class="error" th:if="${error == 'invalid_credentials'}">Неверное имя пользователя или пароль.</div>
        <div class="error" th:if="${error == 'account_disabled'}">Этот аккаунт отключён.</div>
        <div class="error" th:if="${error == 'account_locked'}">Этот аккаунт временно заблокирован.</div>

        <div class="success" th:if="${message == 'password_reset_success'}">Пароль обновлён. Войдите с новым паролем.</div>

        <form method="post" th:action="@{/oauth2/authorize/callback}">
            <input type="hidden" name="auth_request_id" th:value="${authRequestId}"/>

            <div class="field">
                <label for="username">Имя пользователя или email</label>
                <input id="username" type="text" name="username" autocomplete="username" autofocus required placeholder="admin@example.com"/>
            </div>

            <div class="field">
                <label for="password">Пароль</label>
                <input id="password" type="password" name="password" autocomplete="current-password" required placeholder="••••••••"/>
            </div>

            <button type="submit">Войти</button>
        </form>

            <a href="/forgot-password" class="forgot-link">Забыли пароль?</a>
    </div>

    <p class="footer">Защищено OAuth 2.0 + PKCE</p>
</div>
</body>
</html>
