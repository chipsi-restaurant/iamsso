<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ваш код подтверждения</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f7;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7;">
    <tr>
        <td align="center" style="padding:40px 20px;">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background-color:#ffffff;border-radius:8px;overflow:hidden;">
                <!-- Logo -->
                <tr>
                    <td style="padding:32px 40px 0 40px;">
                        <span style="font-size:22px;font-weight:700;color:#061b31;letter-spacing:-0.5px;">iamsso</span>
                    </td>
                </tr>
                <!-- Content -->
                <tr>
                    <td style="padding:32px 40px;">
                        <h1 style="margin:0 0 24px 0;font-size:20px;font-weight:600;color:#061b31;line-height:1.4;">Ваш код подтверждения</h1>
                        <p style="margin:0 0 28px 0;font-size:15px;color:#64748d;line-height:1.6;">Используйте код ниже для подтверждения действия:</p>
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                            <tr>
                                <td align="center" style="padding:24px 0;">
                                    <span th:text="${code}" style="font-size:32px;font-weight:700;font-family:'Courier New',Courier,monospace;letter-spacing:8px;color:#061b31;"></span>
                                </td>
                            </tr>
                        </table>
                        <p style="margin:0;font-size:13px;color:#64748d;line-height:1.5;">Код действителен до <span th:text="${expiresAt}"></span></p>
                    </td>
                </tr>
                <!-- Footer -->
                <tr>
                    <td style="padding:0 40px 32px 40px;border-top:1px solid #eef0f3;">
                        <p style="margin:24px 0 0 0;font-size:13px;color:#9ca3af;line-height:1.5;">Если вы не запрашивали этот код, проигнорируйте это письмо.</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
