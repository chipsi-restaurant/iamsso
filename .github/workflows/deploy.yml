name: Build & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/sinusxd/iamsso

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all services
        run: ./gradlew bootJar -x test

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push images
        run: |
          TAG="${{ github.sha }}"
          SERVICES="auth-service user-service session-service mfa-service gateway-service policy-service audit-service notification-service"

          for SVC in $SERVICES; do
            echo "::group::$SVC"
            docker build -t $IMAGE_PREFIX/$SVC:$TAG -t $IMAGE_PREFIX/$SVC:latest services/$SVC
            docker push $IMAGE_PREFIX/$SVC:$TAG
            docker push $IMAGE_PREFIX/$SVC:latest
            echo "::endgroup::"
          done

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yaml,docker-compose.prod.yaml,infra/"
          target: ~/iamsso

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/iamsso
            echo ${{ secrets.GH_PAT }} | docker login ghcr.io -u sinusxd --password-stdin
            docker compose -f docker-compose.yaml -f docker-compose.prod.yaml pull
            docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d
            docker image prune -f
